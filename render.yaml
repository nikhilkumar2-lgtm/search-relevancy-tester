services:
  - type: web
    name: relevancy-api
    runtime: node
    plan: free
    buildCommand: npm install --prefix server
    startCommand: node server/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: CORS_ORIGIN          # your Netlify URL, e.g. https://your-site.netlify.app (comma-separate several)
        sync: false
      - key: ACCESS_TOKEN         # shared secret the UI asks for; generated for you, read it in the Render dashboard
        generateValue: true
      - key: ANTHROPIC_API_KEY    # optional (ground-truth generator)
        sync: false
      - key: OPENAI_API_KEY       # optional
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON   # optional: raw or base64 key JSON, for private sheets / write-back
        sync: false
      # Run history and generated files are written to DATA_DIR. The free plan's disk is ephemeral
      # (cleared on redeploy / restart). For persistence use a paid plan and add:
      # disk: { name: data, mountPath: /var/data, sizeGB: 1 }  + env DATA_DIR=/var/data
