[build]
  base = "client"
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Set VITE_API_URL (Site settings > Environment variables) to your Render URL, e.g. https://relevancy-api.onrender.com

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
